name: Code Quality

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    build-matrix:
        uses: ./.github/workflows/build-matrix.yml

    lint:
        name: Lint ${{ matrix.package }}
        runs-on: ubuntu-latest
        needs: build-matrix

        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJson(needs.build-matrix.outputs.packages) }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install root dependencies
              uses: ramsey/composer-install@v3

            - name: Build packages
              run: php .github/build-packages.php

            - name: Clean vendor
              run: rm -rf vendor ${{ matrix.package }}/vendor

            - name: Install package dependencies
              uses: ramsey/composer-install@v3
              with:
                  working-directory: ${{ matrix.package }}

            - name: Run linters
              working-directory: ${{ matrix.package }}
              run: composer lint

    deptrac:
        name: Deptrac Architecture Validation
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'

            - name: Install dependencies
              uses: ramsey/composer-install@v3

            - name: Run Deptrac
              run: composer deptrac
