name: Split Packages

on:
    push:
        tags:
            - 'v*.*.*'
    workflow_dispatch:

jobs:
    split:
        name: Split ${{ matrix.package }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                package:
                    - awesome-mate
                    - common
                    - extension-template
                    - phpunit-extension
                    - phpstan-extension

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0  # Full history for split

            - name: Setup splitsh-lite
              run: |
                  wget https://github.com/splitsh/lite/releases/latest/download/lite_linux_amd64 -O splitsh-lite
                  chmod +x splitsh-lite
                  sudo mv splitsh-lite /usr/local/bin/

            - name: Get repository URL and path
              id: repo
              run: |
                  case "${{ matrix.package }}" in
                      awesome-mate)
                          echo "url=git@github.com:MatesOfMate/awesome-mate.git" >> $GITHUB_OUTPUT
                          echo "path=awesome-mate" >> $GITHUB_OUTPUT
                          ;;
                      common)
                          echo "url=git@github.com:MatesOfMate/common.git" >> $GITHUB_OUTPUT
                          echo "path=src/common" >> $GITHUB_OUTPUT
                          ;;
                      extension-template)
                          echo "url=git@github.com:MatesOfMate/extension-template.git" >> $GITHUB_OUTPUT
                          echo "path=src/extension-template" >> $GITHUB_OUTPUT
                          ;;
                      phpunit-extension)
                          echo "url=git@github.com:matesofmate/phpunit-extension.git" >> $GITHUB_OUTPUT
                          echo "path=src/phpunit-extension" >> $GITHUB_OUTPUT
                          ;;
                      phpstan-extension)
                          echo "url=git@github.com:matesofmate/phpstan-extension.git" >> $GITHUB_OUTPUT
                          echo "path=src/phpstan-extension" >> $GITHUB_OUTPUT
                          ;;
                  esac

            - name: Split package
              run: |
                  splitsh-lite \
                      --prefix=${{ steps.repo.outputs.path }} \
                      --target=${{ steps.repo.outputs.url }} \
                      --origin=refs/heads/main

            - name: Tag split repository
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  TAG=${GITHUB_REF#refs/tags/}
                  cd /tmp/splitsh-cache
                  git tag $TAG
                  git push origin $TAG
