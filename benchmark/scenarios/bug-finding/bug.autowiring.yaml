id: bug.autowiring
suite: bug-finding
difficulty: medium

fixture:
  path: fixtures/bug.autowiring

task:
  prompt: |
    Requesting `OrderService` from the container fails with a runtime error
    during the verification test. Find the root cause in the service
    configuration and fix it. Touch only the file(s) responsible for the
    problem.

expected:
  pass_commands:
    - php tests/test.php
  root_cause:
    - ["paymentgateway", "payment gateway"]
    - ["not registered", "never registered", "was not registered", "isn't registered", "unregistered", "missing registration"]
  expected_files_changed:
    - src/services.php
  forbidden_files_changed:
    - tests/test.php
