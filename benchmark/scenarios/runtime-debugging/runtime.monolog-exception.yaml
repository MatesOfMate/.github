id: runtime.monolog-exception
suite: runtime-debugging
difficulty: easy

fixture:
  path: fixtures/runtime.monolog-exception

task:
  prompt: |
    Running the verification test fails: `AuditLogger::logUserDeletion()`
    triggers a runtime error before any record reaches the logger. Diagnose
    the failure and fix `src/AuditLogger.php` so the record is written the
    way the test expects and the test passes. `src/SimpleLogger.php` and the
    test files must not be modified.

expected:
  pass_commands:
    - php tests/test.php
  root_cause:
    - ["undefined method", "does not exist", "doesn't exist", "no such method", "missing method", "nonexistent method", "non-existent method", "no info() method"]
    - ["audit"]
  expected_files_changed:
    - src/AuditLogger.php
  forbidden_files_changed:
    - tests/test.php
    - src/SimpleLogger.php
