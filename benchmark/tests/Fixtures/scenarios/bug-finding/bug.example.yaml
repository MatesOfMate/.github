id: bug.example
suite: bug-finding
difficulty: medium

fixture:
  path: fixtures/bug-example
  setup:
    - composer install
  baseline:
    - vendor/bin/phpunit

task:
  prompt: |
    The application fails when running the tests. Find and fix the bug.

expected:
  pass_commands:
    - vendor/bin/phpunit
  root_cause:
    - missing service definition
    - ["not registered", "never registered", "unregistered"]
  expected_files_changed:
    - config/services.yaml
  forbidden_files_changed:
    - composer.lock

evaluation:
  weights:
    functional: 40
    root_cause: 20
    mate_tool_usage: 15
    minimality: 10
    verification: 10
    efficiency: 5
