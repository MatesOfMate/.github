deptrac:
  paths:
    - ./src

  exclude_files:
    - .*Test\.php
    - .*/Tests/.*

  layers:
    # Packages
    - name: Common
      collectors:
        - type: classNameRegex
          value: ^MatesOfMate\\Common\\.*

    - name: PHPUnit Extension
      collectors:
        - type: classNameRegex
          value: ^MatesOfMate\\PHPUnitExtension\\.*

    - name: PHPStan Extension
      collectors:
        - type: classNameRegex
          value: ^MatesOfMate\\PhpStan\\.*

    - name: Extension Template
      collectors:
        - type: classNameRegex
          value: ^MatesOfMate\\ExampleExtension\\.*

    # Layer by responsibility (cross-package)
    - name: Capability
      collectors:
        - type: classNameRegex
          value: .*\\Capability\\.*

    - name: Runner
      collectors:
        - type: classNameRegex
          value: .*\\Runner\\.*

    - name: Parser
      collectors:
        - type: classNameRegex
          value: .*\\Parser\\.*

    - name: Formatter
      collectors:
        - type: classNameRegex
          value: .*\\Formatter\\.*

    - name: Config
      collectors:
        - type: classNameRegex
          value: .*\\Config\\.*

    - name: Discovery
      collectors:
        - type: classNameRegex
          value: .*\\Discovery\\.*

  ruleset:
    # Package dependency rules
    Common:
      # Common should have no dependencies on extensions

    PHPUnit Extension:
      - Common

    PHPStan Extension:
      - Common

    Extension Template:
      - Common

    # Layer dependency rules
    Capability:
      - Runner
      - Parser
      - Formatter
      - Config
      - Discovery
      - Common

    Runner:
      - Config
      - Common

    Parser:
      - Common

    Formatter:
      - Common

    Config:
      - Common

    Discovery:
      - Config
      - Common

  skip_violations:
    # Add specific violations to skip if needed
