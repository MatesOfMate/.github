deptrac:
  paths:
    - ./src/common/src
    - ./src/common/tests
    - ./src/phpunit-extension/src
    - ./src/phpunit-extension/tests
    - ./src/phpstan-extension/src
    - ./src/phpstan-extension/tests
    - ./src/rector-extension/src
    - ./src/rector-extension/tests
    - ./src/composer-extension/src
    - ./src/composer-extension/tests
    - ./src/extension-template/src
    - ./src/extension-template/tests

  exclude_files:
    - .*Test\.php
    - .*/Tests/.*

  layers:
    # Package-level boundaries - simpler and more reliable
    - name: Common
      collectors:
        - type: directory
          value: src/common/.*

    - name: PHPUnit Extension
      collectors:
        - type: directory
          value: src/phpunit-extension/.*

    - name: PHPStan Extension
      collectors:
        - type: directory
          value: src/phpstan-extension/.*

    - name: Rector Extension
      collectors:
        - type: directory
          value: src/rector-extension/.*

    - name: Composer Extension
      collectors:
        - type: directory
          value: src/composer-extension/.*

    - name: Extension Template
      collectors:
        - type: directory
          value: src/extension-template/.*

  ruleset:
    # Package dependency rules - enforce package isolation
    # Common should not depend on any extensions
    Common: []

    # Extensions can only depend on Common, not on each other
    PHPUnit Extension:
      - Common

    PHPStan Extension:
      - Common

    Rector Extension:
      - Common

    Composer Extension:
      - Common

    Extension Template:
      - Common
